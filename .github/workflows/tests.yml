name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (edge, gateway, ai, telegram)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Pasang empat service
        run: |
          python -m pip install --upgrade pip
          pip install -e services/edge -e services/gateway -e services/ai -e services/telegram pytest
      - name: Edge
        run: cd services/edge && python -m pytest -q
      - name: Gateway
        run: cd services/gateway && python -m pytest -q
      - name: AI
        run: cd services/ai && python -m pytest -q
      - name: Telegram
        run: cd services/telegram && python -m pytest -q

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validasi compose dengan .env contoh
        run: |
          cp .env.example .env
          docker compose config --quiet
