listener 1883
protocol mqtt

# v1 jalan di jaringan Docker tertutup, jadi belum pakai autentikasi. Saat
# perangkat fisik masuk di v1.5 ini harus diganti user dan password per
# perangkat, atau sertifikat klien.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
