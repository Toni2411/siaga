[project]
name = "siaga-gateway"
version = "0.1.0"
description = "Gateway SIAGA: vektor ciri dari MQTT ke TimescaleDB"
requires-python = ">=3.10"
dependencies = [
    "siaga-edge",
    "paho-mqtt>=2.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["siaga_gateway"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
