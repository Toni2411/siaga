[project]
name = "siaga-telegram"
version = "0.1.0"
description = "Relay SIAGA: update Telegram ke ERPNext lewat long polling"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["siaga_telegram"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
