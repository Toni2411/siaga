[project]
name = "siaga-edge"
version = "0.1.0"
description = "Virtual edge SIAGA: pemrosesan sinyal dan ekstraksi ciri di sisi alat"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["siaga_edge"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
